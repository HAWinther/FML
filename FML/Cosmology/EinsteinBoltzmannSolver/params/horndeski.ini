# Horndeski gravity in the alpha parameterization of hi_class (Bellini & Sawicki 2014), with alpha_T = 0.
# The expansion is LCDM (or w0-wa with hd_w0, hd_wa) as in GR; the perturbations follow
#   alpha_K = c_K f(a) (kineticity), alpha_B = c_B f(a) (braiding), alpha_M = c_M f(a) (running Planck mass),
# with f = Omega_DE(a) (hd_parametrization = 0, hi_class propto_omega), a (1, propto_scale) or 1 (2, constant_alphas),
# and M*^2 integrated from hd_M2_ini at early times. Unstable models (ghost or gradient instability) are rejected.
# python/compare_hiclass.py compares a run with hi_class.
model = horndeski
hd_parametrization = 0
hd_cK = 1
hd_cB = 0.6
hd_cM = 0.3
lensing = true
output_dir = data/horndeski
