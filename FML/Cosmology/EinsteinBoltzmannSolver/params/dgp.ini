# DGP braneworld (flat), quasi-static perturbations (mu = 1 + 1/(3 beta), Sigma = 1).
#   Normal branch with Lambda (default below), Omega_rc = c^2/(4 r_c^2 H0^2) = 0.25, i.e. H0 r_c / c = 1.
#   dgp_lcdm_background = 1: LCDM expansion, only the growth modified (the nDGP of N-body simulations).
#   Self-accelerating branch without dark energy:  ./cmb params/dgp.ini dgp_branch=1 Omega_rc=0
model = dgp
Omega_rc = 0.25
dgp_branch = -1
dgp_lcdm_background = 0
lensing = true
output_dir = data/dgp
