# Axion-like early dark energy (Poulin et al. 2019; Smith et al. 2020): V = m^2 f^2 (1 - cos(phi/f))^n plus a
# cosmological constant from closure. The potential parameters m and f are found from the maximum fraction
# f_EDE = max rho_EDE/rho_tot and its redshift z_c (n > 2). The values below are close to the best fit of
# Hill et al. 2020 (whose H0 is higher; here the other parameters are the fiducial ones).
# python/compare_class_ede.py compares a run with CLASS_EDE.
model = ede
ede_fEDE = 0.12
ede_log10zc = 3.56
ede_theta_i = 2.83
ede_n = 3
lensing = true
output_dir = data/ede
