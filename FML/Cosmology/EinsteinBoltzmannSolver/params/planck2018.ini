# Planck 2018 (TT,TE,EE+lowE+lensing+BAO means, massless neutrinos) with lensed spectra up to ell = 2500.
# For Planck's baseline (one massive neutrino of 0.06 eV) use preset = planck2018_baseline.
#   ./cmb params/planck2018.ini
preset = planck2018
lensing = true
ell_max = 2500
output_dir = data/planck2018
