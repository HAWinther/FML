# Interacting dark energy: a dark-energy fluid (constant w, rest-frame sound speed cs2) exchanging energy with
# the dark matter, Q = xi H rho_DE along the dark-matter velocity (Gavela et al. 2009). xi < 0: energy flows
# from the dark matter to the dark energy. Stable for xi (1 + w) < 0 (doom factor d = xi/(3(1+w)) < 0).
model = ide
ide_xi = -0.1
ide_w = -0.95
ide_cs2 = 1
lensing = true
output_dir = data/ide
