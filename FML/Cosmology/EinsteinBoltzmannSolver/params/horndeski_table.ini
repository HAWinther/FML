# A reduced Horndeski theory (K(phi, X), G3(phi, X), G4(phi)) from its Lagrangian: the table written by
# SimulationCode/scripts/horndeski_frontend.py (here the cubic Galileon of SimulationCode/input/horndeski, started on
# its tracker; the same table gives SimulationCode's force, gravity_model = Horndeski). Its H(a) and the alphas
# derived from the Lagrangian (alpha parameterization, alpha_T = 0, full scalar perturbations, stability checked).
# The table is made for one cosmology: h, OmegaB, OmegaCDM, TCMB and Neff must be those of the frontend's JSON file
# (checked); flat, no massive neutrinos.
model = horndeski_table
model_file = ../../SimulationCode/input/horndeski/cubic_galileon_gravity.txt
h = 0.671
OmegaB = 0.049
OmegaCDM = 0.2685
TCMB = 2.7255
Neff = 3.046
lensing = true
output_dir = data/horndeski_table
