# Fading Dark Sector (Obied, Vafa & Wu, arXiv:2611.17422): V_DE = V0 exp(-c phi), m_DM = m0 exp(-c' phi)
# (phi in reduced Planck masses). This is coupled_quintessence with lambda = c, beta = c': the CDM feels
# G_eff = G (1 + 2 c'^2) from the CDM, has the drag -c' dphi/dlna, and exchanges energy with the field.
# V0 and the CDM normalisation are set so that OmegaCDM and closure hold today.
# Best fit of CMB + DESI DR1 full shape + DR2 BAO + DES-Dovekie (their Table I): c = -0.85, c' = 0.05.
model = fading_dark_sector
fds_c = -0.85
fds_cprime = 0.05
lensing = true
output_dir = data/fading_dark_sector
