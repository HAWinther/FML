# Jordan-Brans-Dicke gravity with a cosmological constant (flat). phi today gives the Newtonian G
# (Cavendish), Omega_Lambda follows from E(0) = 1. GR for bd_omega -> infinity (Cassini: omega > 40000).
# nonlinear = jbd_boost: the nonlinear P(k) of Sletmoen & Winther (2024) from GR (EuclidEmulator2 by default).
model = jbd
bd_omega = 1000
lensing = true
output_dir = data/jbd
