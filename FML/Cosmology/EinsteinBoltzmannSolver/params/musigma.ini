# mu-Sigma modified gravity in the Planck/DES form (flat; LCDM background):
#   mu    = 1 + mu0    Omega_DE(a)/Omega_DE,0   (k^2 Psi           = -4 pi G a^2 mu    rho Delta)
#   Sigma = 1 + Sigma0 Omega_DE(a)/Omega_DE,0   (k^2 (Phi_P + Psi) = -8 pi G a^2 Sigma rho Delta)
#   ./cmb params/musigma.ini [mu0=... Sigma0=...]
model = musigma
mu0 = 0.3
Sigma0 = 0.1
lensing = true
output_dir = data/musigma
