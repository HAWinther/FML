# The (m(a), beta(a)) parametrisation of chameleon-like theories (Brax, Davis, Li & Winther 2012): LCDM background,
# quasi-static mu(k, a) = 1 + 2 beta^2 k^2 / (k^2 + a^2 m^2), beta = mb_beta0 a^mb_n_beta, m = mb_m0 (H0/c) a^mb_n_m.
# Here roughly f(R) with |f_R0| ~ 1e-5, n = 1 (beta = 1/sqrt(6), m ~ a^-9/2). The same theory as SimulationCode's
# gravity_model = mbeta (gravity_model_mbeta_params = {beta0, n_beta, m0, n_m}).
model = mbeta
mb_beta0 = 0.408248290463863
mb_n_beta = 0
mb_m0 = 400
mb_n_m = -4.5
pert_k_max = 3.0
los_k_max = 0.3
lensing = true
output_dir = data/mbeta
