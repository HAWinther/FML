# Planck 2018 LCDM with a CDM isocurvature mode, P_II = f^2 A_s (k/k_pivot)^(n_cdi - 1), correlated with the adiabatic
# mode (c_ad_cdi, CLASS convention). Unlensed and lensed TT, EE, TE, BB and P(k) include both.
#   ./cmb params/isocurvature.ini
#   python3 python/compare_class_spectra.py data/isocurvature      (unlensed spectra and P(k) against CLASS)
preset = planck2018
f_cdi = 0.3
n_cdi = 1.0
c_ad_cdi = -0.2
lensing = true
ell_max = 2000
output_dir = data/isocurvature
