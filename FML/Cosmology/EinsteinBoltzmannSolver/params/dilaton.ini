# The environment-dependent dilaton (Brax, van de Bruck, Davis & Shaw 2010; the parametrisation of Brax et al. 2012):
# LCDM background, quasi-static mu(k, a) = 1 + 2 beta(a)^2 k^2 / (k^2 + a^2 m(a)^2), m(a) = m0 a^-r, xi = H0 / m0
# (range today 2998 xi Mpc/h). The same theory as SimulationCode's gravity_model = Dilaton.
model = dilaton
dil_A2 = 5e5
dil_beta0 = 0.5
dil_r = 1.0
dil_xi = 1e-3
pert_k_max = 3.0
los_k_max = 0.3
lensing = true
output_dir = data/dilaton
