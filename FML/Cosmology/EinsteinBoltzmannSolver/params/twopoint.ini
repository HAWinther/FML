# All two-point functions of the fiducial model (report section "Extension: two-point functions").
#   ./cmb params/twopoint.ini > data/log_twopoint.txt
#   python3 report/make_twopoint_figure.py
#   python3 python/compare_class_twopoint.py data/twopoint
# The perturbations go to k = 1/Mpc so that P(k) includes the residual BAO wiggles needed for xi(r)
# and the projected C_ell at high ell; the CMB line-of-sight integration only needs 0.3/Mpc.
pert_k_max = 1.0
pert_n_k = 460                    # same density in ln k as the default 400 points up to 0.3/Mpc
los_k_max = 0.3
ell_max = 2500
lensing = true
cmb_correlation = true
cmb_correlation_beam_fwhm = 1     # also writes cmb_correlation_*_beam1deg.txt
matter_correlation = true
angular_z = 0.5, 1.0
angular_sigma_z = 0.1
perturbation_k_output =
output_dir = data/twopoint
