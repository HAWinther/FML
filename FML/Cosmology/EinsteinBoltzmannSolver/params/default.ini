# Parameter file for the Einstein-Boltzmann solver: ./cmb <this file> [name=value ...]
# Every parameter is listed with its value; any of them can be left out (default) or overridden on the
# command line. Units: k in 1/Mpc, angles in degrees, x = ln a. Booleans: true/false.
#
# preset = fiducial      # or planck2018: loads that parameter set before the cosmological parameters below
# precision = default    # or fast: precision parameters for parameter fits (lensed TT/EE/TE to ell = 2500
#                        # with dchi2 < 1 for Planck, ~5x faster); explicit precision parameters override it

# --- Cosmology -------------------------------------------------------------
h = 0.67                                  # H0 / (100 km/s/Mpc)
OmegaB = 0.05                             # baryon density today
OmegaCDM = 0.267                          # cold dark matter density today
OmegaK = 0                                # curvature today (0 = flat; > 0 open, < 0 closed). Omega_Lambda follows from closure
TCMB = 2.7255                             # CMB temperature today [K]
Neff = 3.046                              # effective number of neutrinos, massless + massive (0 = no neutrinos)
m_nu = 0                                  # mass of the single massive neutrino species [eV] (0 = all massless)
T_ncdm_over_TCMB = 0.71611                # temperature of the massive species / TCMB (CLASS default)
model = lcdm                              # model (Model.h): lcdm = LCDM (+ curvature, massive neutrinos) in general relativity; musigma = LCDM background, perturbations with mu(a), Sigma(a) of Planck/DES (flat); dgp = DGP braneworld (flat): modified Friedmann equation, quasi-static mu(a), Sigma = 1; Omega_Lambda from E(0) = 1; quintessence = scalar field with V = V0 exp(-lambda phi), thawing from rest; V0 from closure; GR; jbd = Jordan-Brans-Dicke (flat) with Lambda; phi today gives the Newtonian G, Omega_Lambda from E(0) = 1; fr = Hu-Sawicky f(R) (flat): LCDM background, quasi-static mu(k, a) and Sigma(a); coupled_quintessence = quintessence (V ~ exp(-lambda phi)) coupled to CDM (m ~ exp(-beta phi)); GR; dark_scattering = wCDM (dark-energy fluid with perturbations) with elastic dark matter - dark energy scattering; GR; cubic_galileon = cubic Galileon on its tracker (flat, no Lambda): Omega_phi from closure, no free parameter; horndeski = Horndeski in the alpha parameterization of hi_class (alpha_T = 0, flat): LCDM or w0-wa expansion, alpha_X = c_X f(a); stability checked; w0wa = dark energy with w(a) = w0 + wa (1 - a), smooth (no perturbations: for background data); GR; ede = axion-like early dark energy V ~ (1 - cos(phi/f))^n with its perturbations, + Lambda (closure); GR; ide = dark-energy fluid (w, cs2) exchanging energy with CDM, Q = xi H rho_DE along u_c; GR; its parameters follow
A_s = 2.1e-09                             # primordial curvature power at k_pivot
n_s = 0.965                               # scalar spectral index
k_pivot = 0.05                            # pivot scale [1/Mpc]
f_cdi = 0                                 # CDM isocurvature: amplitude ratio, P = f^2 A_s (k/k_pivot)^(n - 1) (0 = off)
n_cdi = 1                                 # CDM isocurvature: spectral index
c_ad_cdi = 0                              # CDM isocurvature: correlation with the adiabatic mode (CLASS convention)
f_bi = 0                                  # baryon isocurvature: amplitude ratio, P = f^2 A_s (k/k_pivot)^(n - 1) (0 = off)
n_bi = 1                                  # baryon isocurvature: spectral index
c_ad_bi = 0                               # baryon isocurvature: correlation with the adiabatic mode (CLASS convention)
f_nid = 0                                 # neutrino density isocurvature: amplitude ratio, P = f^2 A_s (k/k_pivot)^(n - 1) (0 = off)
n_nid = 1                                 # neutrino density isocurvature: spectral index
c_ad_nid = 0                              # neutrino density isocurvature: correlation with the adiabatic mode (CLASS convention)
f_niv = 0                                 # neutrino velocity isocurvature: amplitude ratio, P = f^2 A_s (k/k_pivot)^(n - 1) (0 = off)
n_niv = 1                                 # neutrino velocity isocurvature: spectral index
c_ad_niv = 0                              # neutrino velocity isocurvature: correlation with the adiabatic mode (CLASS convention)
r = 0                                     # tensor-to-scalar ratio at k_pivot (> 0: tensor modes, flat universe only)
n_t_consistency = true                    # tensor tilt from the consistency relation n_t = -r/8 (2 - r/8 - n_s)
n_t = 0                                   # tensor tilt (used if n_t_consistency = false)

# --- Recombination ---------------------------------------------------------
Yp = 0.245                                # primordial helium mass fraction
Yp_bbn = false                            # Yp from standard BBN for omega_b and Neff (PArthENoPE table, as CLASS YHe = BBN)
reionization = true                       # tanh reionization (CAMB/CLASS reio_camb)
z_reion = 8                               # hydrogen (+ first helium) reionization redshift
delta_z_reion = 0.5                       # width of hydrogen reionization
z_He_reion = 3.5                          # second helium reionization redshift
delta_z_He_reion = 0.5                    # width of second helium reionization
recombination = recfast                   # recombination model: recfast (RECFAST 1.5, H + He) or peebles (Peebles + Saha)
rec_helium = true                         # helium ionization
rec_recfast_fudge_H = 1.125               # RECFAST: hydrogen fudge factor
rec_recfast_fudge_He = 0.86               # RECFAST: helium fudge factor
rec_peebles_fudge = 1                     # Peebles: factor on the case-B recombination rate
rec_Xe_saha_limit = 0.99                  # Peebles: switch from Saha to Peebles when x_H drops below this
rec_evolve_Tb = true                      # evolve the baryon temperature (else T_b = T_gamma)
rec_x_start = -20                         # start of the recombination grid (x = ln a)
rec_n_points = 40000                      # points in the recombination grid

# --- Background ------------------------------------------------------------
bg_x_start = -20                          # start of the background ODE
bg_x_end = 5                              # end of the background ODE
bg_n_points = 5000                        # points of the eta(x), t(x) splines

# --- Perturbations ---------------------------------------------------------
polarization = true                       # photon polarization hierarchy
neutrinos = true                          # massless neutrino hierarchy (only active if Neff > 0)
pert_k_min = 5e-05                        # smallest k (q in a curved universe) [1/Mpc]
pert_k_max = 0.3                          # largest k [1/Mpc]
pert_n_k = 400                            # number of k-modes (log spaced)
pert_dk_max = 0                           # if > 0: log-linear k-grid, largest spacing [1/Mpc] (n_k sets the log spacing)
pert_x_start = -18                        # initial time of the perturbations (x = ln a)
pert_n_x_early = 300                      # stored x-points in [x_start, -8]
pert_n_x_recomb = 1200                    # stored x-points in [-8, -6]
pert_n_x_late = 600                       # stored x-points in [-6, 0]
lmax = 8                                  # highest photon multipole (temperature and polarization)
lmax_nu = 22                              # highest massless-neutrino multipole
lmax_ncdm = 17                            # highest massive-neutrino multipole
n_q_ncdm = 8                              # momentum nodes for the massive neutrinos
ncdm_fluid_trigger = 31                   # k eta above which massive neutrinos are a fluid (1e30 = never)
tc_tau_min = 10                           # end tight coupling when |tau'| < this
tc_k_over_tau = 0.1                       # ... or when ck/(Hp |tau'|) > this
tc_z_max = 1700                           # ... or at the latest at this redshift
ode_abserr = 1e-10                        # absolute ODE tolerance
ode_relerr = 1e-08                        # relative ODE tolerance
method_tc = rk8pd                         # ODE method in tight coupling (rk8pd, rkf45, rkck, msbdf, bsimp, ...)
method_full = msbdf                       # ODE method after tight coupling (stiff: msbdf)
method_ncdm = rk8pd                       # ODE method with the massive-neutrino hierarchy
store_source_components = false           # also store the SW, ISW, Doppler, quadrupole terms of S_T

# --- Tensors ---------------------------------------------------------------
tensor_k_max = 0.15                       # largest k of the tensor modes [1/Mpc]
tensor_dk_max = 0.0015                    # largest k-spacing of the tensor modes above k_fine [1/Mpc]
tensor_k_fine = 0.02                      # below this k the tensor mode spacing resolves 2 pi/eta0 [1/Mpc]
tensor_n_k_per_oscillation = 2            # tensor modes per 2 pi/eta0 below k_fine
tensor_lmax = 8                           # highest photon multipole of the tensor hierarchies
tensor_lmax_nu = 16                       # highest neutrino multipole of the tensor hierarchy
tensor_neutrinos = true                   # neutrino anisotropic stress in the tensor equation
tensor_ode_relerr = 1e-07                 # relative ODE tolerance of the tensor modes
tensor_ode_abserr = 1e-08                 # absolute ODE tolerance of the tensor modes
tensor_ell_max = 600                      # tensor C_ell up to this ell (zero above)

# --- PowerSpectrum ---------------------------------------------------------
ell_max = 2000                            # highest multipole of the CMB spectra
ells =                                    # multipoles where C_ell is computed (empty = default list up to ell_max)
ell_step = 25                             # spacing of the default ell list above ell = 100
lensing = false                           # lensing potential and lensed TT, EE, TE, BB
lensing_delta_ell = -1                    # extra multipoles for lensing (-1 = max(500, ell_max/3))
lensing_limber_ell = 30                   # C_ell^phiphi from Limber above this ell
los_k_min = 0                             # smallest k of the LOS integration [1/Mpc] (0 = perturbation range)
los_k_max = 0                             # largest k of the LOS integration [1/Mpc] (0 = perturbation range)
n_k_per_oscillation = 4                   # LOS k-points per 2 pi / eta0
dlnk_max = 0.02                           # largest LOS spacing in ln k
x_start_los = -8.5                        # start of the LOS integral
n_eta_per_oscillation = 5                 # LOS x-points per Bessel oscillation at k_max
dx_recomb = 0.003                         # LOS x-spacing around recombination
x_recomb_min = -7.6                       # start of the fine recombination window
x_recomb_max = -6.2                       # end of the fine recombination window
bessel_points_per_2pi = 32                # points per 2 pi in the Bessel tables
use_radial_functions = false              # use the curved-space radial functions also when flat (test)
flat_approximation_nu = 4000              # curved: flat approximation of Phi^nu_ell above this nu (1e30 = off)
dx_max_subsampled = 0.01                  # curved: largest x-spacing of the subsampled LOS grid
source_term = all                         # temperature source to integrate: all, sw, isw, doppler, quadrupole (anything but all needs store_source_components = true)
nonlinear = none                          # nonlinear matter power for lensing and P(k): none or halofit (Takahashi 2012)

# --- Output ----------------------------------------------------------------
output_dir = data                         # directory for all output files
write_background = true                   # background.txt
write_recombination = true                # recombination.txt
perturbation_k_output = 0.001, 0.01, 0.1  # k [1/Mpc] for perturbations_k<k>.txt (empty = none; closed universe: nearest allowed mode)
compute_cells = true                      # LOS integration: cells.txt (and cells_lensed.txt); false = stop after the perturbations
write_matter_power = true                 # matter_power.txt (k, P_m, P_cb)
matter_power_z = 0                        # redshifts for the matter power spectrum (z = 0: matter_power.txt, else matter_power_z<z>.txt)
transfer_ells = 6, 100, 200, 500, 1000    # ells for transfer.txt (empty = none)
cmb_correlation = false                   # cmb_correlation_unlensed.txt (and _lensed.txt with lensing): C^TT, xi_+, xi_-, xi_X(theta)
cmb_correlation_beam_fwhm = 0             # Gaussian beam FWHM [deg]; > 0 also writes cmb_correlation_*_beam<fwhm>deg.txt
matter_correlation = false                # matter_correlation.txt: xi(r) and sigma_8 at z = 0
matter_correlation_smoothing = 0          # Gaussian smoothing of xi(r) [Mpc/h]
angular_z =                               # centres of Gaussian n(z) for angular_cl_z<z>.txt and angular_w_z<z>.txt (empty = none)
angular_sigma_z = 0.1                     # width of the Gaussian n(z)
angular_bias = 1                          # linear bias of the tracer
angular_ell_max = 2000                    # highest ell in angular_cl_z<z>.txt
