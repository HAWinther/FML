# Hu-Sawicky f(R) gravity (flat): f_R = -|f_R0| (R0/R)^(n+1), LCDM background, quasi-static perturbations.
#   F4, F5, F6: fR0 = 1e-4, 1e-5, 1e-6 (n = 1)
# The enhancement of the growth increases with k: the perturbations are computed to k = 1/Mpc here so
# that P(k) and the lensing potential are not extrapolated with the LCDM shape too early.
model = fr
fR0 = 1e-5
fR_n = 1
pert_k_max = 1.0
los_k_max = 0.3
lensing = true
output_dir = data/fr
