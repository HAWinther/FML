# Mixed dark matter with an ultralight axion (as axionCAMB, Hlozek et al. 2015): the share ax_fraction of the dark
# matter OmegaCDM is an axion field of mass 10^ax_log10_m eV (V = m^2 phi^2 / 2), the rest CDM; Lambda from closure.
# The field starts frozen; its initial value is found so that Omega_ax = ax_fraction OmegaCDM today. The field is
# replaced by its oscillation-averaged fluid (w = 0, c_s^2 = k^2 / (k^2 + 4 m^2 a^2)) once it oscillates fast
# (m / H ~ 125, the default) or, with ax_switch_mH = 3, where m = 3H as axionCAMB does (to compare with it).
# matter_power.txt has P_m (with the axion for m >= 1e-25 eV, as axionCAMB), P_cb (the cold matter) and P_axion.
# Axion isocurvature from the Hubble rate of inflation: ax_log10_Hinf (GeV; or f_axi, n_axi, c_ad_axi directly).
# python/compare_axioncamb.py compares a run with axionCAMB.
model = axion
ax_log10_m = -25
ax_fraction = 0.1
ax_switch_mH = 0
ax_log10_Hinf = 0
lensing = true
output_dir = data/axion
