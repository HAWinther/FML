# Coupled quintessence: V = V0 exp(-lambda phi), CDM mass m(phi) ~ exp(-beta phi) (beta = Amendola's
# sqrt(2/3) beta). The CDM feels a fifth force, G_eff = G (1 + 2 beta^2), and loses energy to the field.
# V0 and the CDM normalisation are set so that OmegaCDM and closure hold today. beta = 0: quintessence.
model = coupled_quintessence
cq_lambda = 0.5
cq_beta = 0.05
lensing = true
output_dir = data/coupled_quintessence
