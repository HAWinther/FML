# The symmetron (Hinterbichler & Khoury 2010; the parameters of Winther et al. 2012, the powers (N, M) of Brax et al.
# 2012): LCDM background, quasi-static mu(k, a) = 1 + 2 beta(a)^2 k^2 / (k^2 + a^2 m(a)^2), no fifth force before
# symmetry breaking (a < sym_assb). The same theory as SimulationCode's gravity_model = Symmetron.
# The fifth force has a range ~ L: the perturbations are computed to k = 3/Mpc here.
model = symmetron
sym_assb = 0.5
sym_beta = 1.0
sym_L_mpch = 1.0
sym_N = 2
sym_M = 4
pert_k_max = 3.0
los_k_max = 0.3
lensing = true
output_dir = data/symmetron
