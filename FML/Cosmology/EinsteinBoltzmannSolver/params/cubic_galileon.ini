# Cubic Galileon on its tracker solution (flat, no cosmological constant). Omega_phi follows from closure and
# fixes the model completely: E^2 = [rho + sqrt(rho^2 + 4 Omega_phi)]/2, w0 = -1.19. The scalar perturbations
# (kinetic braiding) are evolved in full; this model is ruled out by the ISW-galaxy cross-correlation.
model = cubic_galileon
lensing = true
output_dir = data/cubic_galileon
