# Dark scattering (Simpson 2010): elastic scattering between dark matter and a dark-energy fluid with constant
# w (rest-frame sound speed cs2), cross section per dark-matter mass xi [barn/GeV]. Background wCDM.
# For w > -1 the drag suppresses the growth, for w < -1 it enhances it. ds_xi = 0: wCDM with perturbations
# (compare with CLASS: python/compare_class_wcdm.py).
model = dark_scattering
ds_w = -0.9
ds_xi = 10
ds_cs2 = 1
lensing = true
output_dir = data/dark_scattering
