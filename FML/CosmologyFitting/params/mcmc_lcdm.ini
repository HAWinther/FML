# Flat LCDM from background data: DESI DR2 BAO, Planck 2018 distance priors and Pantheon+ supernovae (absolute
# magnitude marginalized; python3 python/fetch_sn_data.py downloads the data; desy5 and union3 are alternatives).
# One massive neutrino with m_nu = 0.06 eV, as in Planck and DESI.
#   make && ./mcmc params/mcmc_lcdm.ini
likelihoods = desi_dr2, planck_dp, pantheonplus
m_nu = 0.06
sample_H0        = 68.0,  50.0, 90.0, 0.5
sample_omega_b   = 0.0224, 0.018, 0.027, 0.0002
sample_omega_cdm = 0.119, 0.09, 0.15, 0.001
mcmc_chains = 4
mcmc_burn_in = 2000
mcmc_min_samples = 4000
mcmc_check_every = 1000
mcmc_Rminus1 = 0.01
mcmc_output = chains/lcdm_desi_planckdp_pantheonplus
