# Jordan-Brans-Dicke: the CMB + SN + BOSS fit of Joudaki, Ferreira, Lima & Winther (2022, arXiv:2010.15278), with
# Pantheon+ instead of Pantheon and Planck plik_lite (TT, TE, EE + low-ell TT, Gaussian tau prior) + lensing instead
# of the full Planck likelihoods. Free: the LCDM parameters, the Brans-Dicke omega (flat in log10 omega), the
# effective gravitational constant today G_matter/G (bd_GeffG_today = G_eff/G; fix it to 1 for a Newtonian G today)
# and the neutrino mass. ~25-35 s per slow point on 2 cores (precision = fast).
#
#   ./mcmc params/mcmc_jbd_planck_boss_pantheonplus.ini sampler=minimize     (best fit)
#   ./mcmc params/mcmc_jbd_planck_boss_pantheonplus.ini                      (MCMC)
#
# Variants (append on the command line): likelihoods=planck_lite_TTTEEE_lowl,planck_lensing,pantheonplus,desi_dr1_shapefit
# (DESI DR1 full shape instead of BOSS), or ...,boss_dr12,kids1000_cosebis with sample_hmcode2016_A = 2.8, 2.0, 3.13,
# 0.25 and jbd_boost_gr=hmcode2016 hmcode2016_eta0_from_A=true (KiDS-1000 cosmic shear; the lensing kernel uses
# G/phi, Theory::lensing_Sigma), or sample_inv_bd_omega = 0.0005, 0, 0.01, 0.0005 for a flat prior on 1/omega.
preset = planck2018
precision = fast
model = jbd
nonlinear = jbd_boost    # nonlinear CMB lensing and P(k): Sletmoen & Winther (2024) boost from GR (EuclidEmulator2)
Yp_bbn = true
likelihoods = planck_lite_TTTEEE_lowl, planck_lensing, pantheonplus, boss_dr12

sample_omega_b         = 0.02238, 0.019, 0.026, 0.00015
sample_omega_cdm       = 0.1201, 0.10, 0.14, 0.0013
sample_theta_MC_100    = 1.04092, 1.03, 1.05, 0.0003
sample_tau_reio        = 0.0560, 0.01, 0.12, 0.007
sample_logA            = 3.049, 2.8, 3.3, 0.014
sample_n_s             = 0.9665, 0.90, 1.03, 0.004
sample_m_nu            = 0.06, 0.0, 1.0, 0.03, \Sigma m_\nu\,[{\rm eV}]
sample_log10_bd_omega  = 4.0, 2.0, 7.0, 0.5, \log_{10}\omega_{\rm BD}
sample_bd_GeffG_today  = 1.0, 0.8, 1.2, 0.02, G_{\rm matter}/G
sample_A_planck        = 1.0, 0.98, 1.02, 0.0025
gauss_tau_reio         = 0.0506, 0.0086      # Planck 2018 lowE (SimAll) alone
gauss_A_planck         = 1.0, 0.0025         # Planck absolute calibration

mcmc_covmat      = params/mcmc_planck_lite_lcdm.covmat
mcmc_chains      = 4
mcmc_burn_in     = 600
mcmc_adapt_every = 100
mcmc_min_samples = 3000
mcmc_check_every = 200
mcmc_max_steps   = 30000
mcmc_Rminus1     = 0.02
mcmc_output      = chains/jbd_planck_boss_pantheonplus
mcmc_oversample_fast = 4
mcmc_resume      = true
