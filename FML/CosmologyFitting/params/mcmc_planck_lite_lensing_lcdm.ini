# Flat LCDM from Planck 2018: plik_lite TT, TE, EE (ell >= 30) + the two low-ell TT bins + the lensing bandpowers
# (8 <= L <= 400), with the Gaussian lowE prior on tau (see params/mcmc_planck_lite_lcdm.ini). The lensing
# likelihood shares the calibration A_planck with plik_lite. One massive neutrino with m_nu = 0.06 eV.
#
#   ./mcmc params/mcmc_planck_lite_lensing_lcdm.ini                        (OpenMP)
#   mpirun -np 4 ./mcmc params/mcmc_planck_lite_lensing_lcdm.ini       (one chain per process)
#   ./mcmc params/mcmc_planck_lite_lensing_lcdm.ini sampler=minimize minimize_starts=1    (best fit)
#
# Expected (Planck 2018 VI, TT,TE,EE+lowE+lensing): omega_b = 0.02237 +- 0.00015, omega_cdm = 0.1200 +- 0.0012,
# n_s = 0.9649 +- 0.0042, ln(10^10 A_s) = 3.044 +- 0.014, tau = 0.0544 +- 0.0073, H0 = 67.36 +- 0.54,
# sigma_8 = 0.8111 +- 0.0060.
preset = planck2018
precision = fast
nonlinear = halofit      # nonlinear lensing (as Planck)
Yp_bbn = true            # helium from BBN for each omega_b (as Planck)
m_nu = 0.06
likelihoods = planck_lite_TTTEEE_lowl, planck_lensing

sample_omega_b      = 0.02238, 0.019, 0.026, 0.00015
sample_omega_cdm    = 0.1201, 0.10, 0.14, 0.0013
sample_theta_MC_100 = 1.04092, 1.03, 1.05, 0.0003
sample_tau_reio     = 0.0560, 0.01, 0.12, 0.007
sample_logA         = 3.049, 2.8, 3.3, 0.014
sample_n_s          = 0.9665, 0.90, 1.03, 0.004
sample_A_planck     = 1.0, 0.98, 1.02, 0.0025
gauss_tau_reio      = 0.0506, 0.0086      # Planck 2018 lowE (SimAll) alone
gauss_A_planck      = 1.0, 0.0025         # Planck absolute calibration

mcmc_covmat      = params/mcmc_planck_lite_lcdm.covmat
mcmc_chains      = 4
mcmc_burn_in     = 600
mcmc_adapt_every = 100
mcmc_min_samples = 3000
mcmc_check_every = 200
mcmc_max_steps   = 20000
mcmc_Rminus1     = 0.02
mcmc_output      = chains/planck_lite_lensing_lcdm
mcmc_oversample_fast = 4
mcmc_resume      = true
