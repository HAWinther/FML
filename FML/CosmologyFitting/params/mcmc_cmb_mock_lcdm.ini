# Flat LCDM from mock CMB data (TT, TE, EE to ell = 2500, Planck-like noise and sky fraction), to test the
# pipeline: the posterior must be centred on the fiducial model (the Planck 2018 preset with m_nu = 0.06 eV:
# omega_b = 0.02242, omega_cdm = 0.11933, theta_MC_100 = 1.039915, tau_reio = 0.0544, logA = 3.047,
# n_s = 0.9665). Make the fiducial spectra first (same precision as the fit):
#
#   cd ../Cosmology/EinsteinBoltzmannSolver && ./cmb params/planck2018.ini m_nu=0.06 precision=fast \
#         output_dir=../../CosmologyFitting/data/cmb_mock && cd -
#   ./mcmc params/mcmc_cmb_mock_lcdm.ini       or   mpirun -np 4 ./mcmc params/mcmc_cmb_mock_lcdm.ini
#
# The covmat of the Planck run is a good starting proposal (the mock noise is similar).
preset = planck2018
precision = fast
m_nu = 0.06
likelihoods = cmb_mock
cmb_mock_file  = data/cmb_mock/cells_lensed.txt
cmb_mock_lmax  = 2500
cmb_mock_fsky  = 0.6
cmb_mock_noise = 33      # muK arcmin (temperature; polarization x sqrt 2)
cmb_mock_beam  = 7       # arcmin FWHM

sample_omega_b      = 0.02242, 0.019, 0.026, 0.00015
sample_omega_cdm    = 0.11933, 0.10, 0.14, 0.0013
sample_theta_MC_100 = 1.039915, 1.03, 1.05, 0.0003
sample_tau_reio     = 0.0544, 0.01, 0.12, 0.007
sample_logA         = 3.047, 2.8, 3.3, 0.014
sample_n_s          = 0.9665, 0.90, 1.03, 0.004
gauss_tau_reio      = 0.0544, 0.0086

mcmc_covmat      = params/mcmc_planck_lite_lcdm.covmat
mcmc_chains      = 4
mcmc_burn_in     = 600
mcmc_min_samples = 3000
mcmc_check_every = 200
mcmc_max_steps   = 20000
mcmc_Rminus1     = 0.02
mcmc_output      = chains/cmb_mock_lcdm
