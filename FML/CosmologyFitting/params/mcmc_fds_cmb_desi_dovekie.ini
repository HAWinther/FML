# Fading Dark Sector (Obied, Vafa & Wu 2026, arXiv:2611.17422): V_DE = V0 exp(-c phi), m_DM = m0 exp(-c' phi) with
# phi in reduced Planck masses, the EBS model fading_dark_sector (= coupled_quintessence with lambda = c,
# beta = c'; the field starts at rest at phi = 0). Only the relative sign of c and c' matters (phi -> -phi), so
# c' >= 0.
#
# Data as in the paper's CMB + DESI DR2 BAO + DES-Dovekie (params/mcmc_fds_cmb_desi15_dovekie.ini adds the DESI DR1 full
# shape):
#   CMB: Planck PR4 CamSpec TTTEEE + Planck 2018 low-ell TT (Commander) and EE (SimAll)
#        (python3 python/fetch_planck_data.py) + ACT DR6 + Planck PR4 lensing
#        (python3 python/convert_act_dr6_lensing.py [ACT_dr6_likelihood_v1.2.tgz])
#   DESI DR2 BAO, DES-Dovekie supernovae (python3 python/fetch_sn_data.py desdovekie)
# The paper's CMB + DESI DR2 BAO: c = -0.72 +0.45 -0.43, c' = 0.048 +0.012 -0.007, Delta chi^2_MAP = -8.8 vs LCDM;
# CMB + DESI1.5 (DR1 full shape + DR2 BAO) + DES-Dovekie: c = -0.82 +0.11 -0.15, c' = 0.053 +0.007 -0.006,
# Delta chi^2 = -20.1.
#
#   mpirun -np 4 ./mcmc params/mcmc_fds_cmb_desi_dovekie.ini                         (one chain per process)
#   ./mcmc params/mcmc_fds_cmb_desi_dovekie.ini sampler=minimize                     (best fit)
#   ./mcmc params/mcmc_fds_cmb_desi_dovekie.ini model=lcdm sample_fds_c= sample_fds_cprime= mcmc_output=...  (LCDM)
#
# CamSpec factorizes its 9915 x 9915 covariance at the start (~1 min on 4 threads, 0.8 GB per process).
preset = planck2018
precision = fast
nonlinear = halofit      # nonlinear lensing (as Planck)
Yp_bbn = true
m_nu = 0.06
model = fading_dark_sector
likelihoods = planck_camspec_npipe_TTTEEE, planck_lowl_TT, planck_lowl_EE, act_dr6_lensing_actplanck, desi_dr2, desdovekie

sample_omega_b      = 0.02223, 0.019, 0.026, 0.00015
sample_omega_cdm    = 0.1186, 0.10, 0.14, 0.0013
sample_theta_MC_100 = 1.04077, 1.03, 1.05, 0.0003
sample_tau_reio     = 0.058, 0.01, 0.12, 0.007
sample_logA         = 3.040, 2.8, 3.3, 0.014
sample_n_s          = 0.9681, 0.90, 1.03, 0.004
sample_fds_c        = -0.8, -3.0, 3.0, 0.15, c
sample_fds_cprime   = 0.05, 0.0, 0.3, 0.008, c^{\prime}

# CamSpec nuisance parameters (Cobaya's priors; the low-ell likelihoods share A_planck)
sample_A_planck     = 1.0, 0.98, 1.02, 0.0025
sample_amp_143      = 10, 0, 50, 1
sample_amp_217      = 20, 0, 50, 1
sample_amp_143x217  = 10, 0, 50, 1
sample_n_143        = 1, 0, 5, 0.2
sample_n_217        = 1, 0, 5, 0.2
sample_n_143x217    = 1, 0, 5, 0.2
sample_calTE        = 1, 0.9, 1.1, 0.01
sample_calEE        = 1, 0.9, 1.1, 0.01
gauss_A_planck      = 1.0, 0.0025
gauss_calTE         = 1.0, 0.01
gauss_calEE         = 1.0, 0.01

mcmc_chains      = 4
mcmc_burn_in     = 600
mcmc_adapt_every = 100
mcmc_min_samples = 3000
mcmc_check_every = 200
mcmc_max_steps   = 20000
mcmc_Rminus1     = 0.02
mcmc_output      = chains/fds_cmb_desi_dovekie
mcmc_oversample_fast = 4
mcmc_resume      = true
