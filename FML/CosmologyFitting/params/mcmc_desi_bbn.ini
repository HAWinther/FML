# Flat LCDM from DESI DR2 BAO and the BBN prior on omega_b alone (as in DESI DR2, Sec. VI); m_nu = 0.06 eV.
#   ./mcmc params/mcmc_desi_bbn.ini
likelihoods = desi_dr2, bbn
m_nu = 0.06
sample_H0        = 68.0,  50.0, 90.0, 0.8
sample_omega_b   = 0.0222, 0.018, 0.027, 0.0005
sample_omega_cdm = 0.119, 0.05, 0.25, 0.003
mcmc_chains = 4
mcmc_burn_in = 2000
mcmc_min_samples = 4000
mcmc_output = chains/lcdm_desi_bbn
