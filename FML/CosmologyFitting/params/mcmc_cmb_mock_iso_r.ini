# Fit check for the isocurvature and tensor parameters: mock TT, TE, EE, BB (ell <= 2000, 10 muK arcmin, 3' beam,
# f_sky = 0.4) for the Planck 2018 cosmology with a correlated CDM isocurvature mode (f_cdi = 0.2,
# c_ad_cdi = 0.2) and r = 0.05; the LCDM parameters are fixed to the fiducial. The fit must recover the fiducial.
# Make the fiducial spectra first (same precision as the fit):
#
#   cd ../Cosmology/EinsteinBoltzmannSolver && ./cmb params/planck2018.ini m_nu=0.06 precision=fast f_cdi=0.2 c_ad_cdi=0.2 r=0.05 lensing=true ell_max=2000 \
#         output_dir=../../CosmologyFitting/data/cmb_mock_iso_r && cd -
#   ./mcmc params/mcmc_cmb_mock_iso_r.ini sampler=minimize minimize_hessian=true      (best fit + errors)
#   ./mcmc params/mcmc_cmb_mock_iso_r.ini                                             (MCMC)
#
# ~25 s per point on 2 cores (two perturbation solves + the tensor modes).
preset = planck2018
precision = fast
m_nu = 0.06
likelihoods = cmb_mock
cmb_mock_file  = data/cmb_mock_iso_r/cells_lensed.txt
cmb_mock_lmax  = 2000
cmb_mock_fsky  = 0.4
cmb_mock_noise = 10      # muK arcmin (temperature; polarization x sqrt 2)
cmb_mock_beam  = 3       # arcmin FWHM
cmb_mock_bb    = true

sample_f_cdi    = 0.1, 0.0, 1.0, 0.05, f_{\rm cdi}
sample_c_ad_cdi = 0.0, -0.95, 0.95, 0.2, c_{\rm ad,cdi}
sample_r        = 0.02, 0.0, 0.3, 0.01, r

minimize_starts  = 2
mcmc_chains      = 2
mcmc_burn_in     = 300
mcmc_min_samples = 1000
mcmc_check_every = 100
mcmc_output      = chains/cmb_mock_iso_r
