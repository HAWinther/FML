# Flat LCDM from the DESI DR1 full-shape power spectra (desi_dr1_fs: BGS, LRG x 3, ELG, QSO; python3
# python/convert_desi_dr1_fullshape.py) + BBN + an n_s prior (DESI 2024 VII's "ns10": n_s = 0.9649 +- 0.042), with
# DESI's bias priors (b1p flat in [0, 3], b2p and bsp Gaussian 0 +- 5; the counterterms and stochastic terms are
# marginalized analytically). One massive neutrino of 0.06 eV. For a best fit use desi_fs_solve = best.
#   ./mcmc params/mcmc_lcdm_desi_fs_bbn.ini
#   ./mcmc params/mcmc_lcdm_desi_fs_bbn.ini sampler=minimize desi_fs_solve=best
precision = fast
m_nu = 0.06
Yp_bbn = true
likelihoods = desi_dr1_fs, bbn

sample_omega_b      = 0.02218, 0.019, 0.026, 0.0005
sample_omega_cdm    = 0.119, 0.08, 0.16, 0.003
sample_H0           = 68.5, 55.0, 85.0, 0.8
sample_logA         = 3.04, 2.0, 4.0, 0.08
sample_n_s          = 0.9649, 0.8, 1.1, 0.02
gauss_n_s           = 0.9649, 0.042
sample_desi_BGS_z0_b1p = 1.036, 0.0, 3.0, 0.05
sample_desi_BGS_z0_b2p = 0.0, -50.0, 50.0, 1.0
sample_desi_BGS_z0_bsp = 0.0, -50.0, 50.0, 1.0
gauss_desi_BGS_z0_b2p  = 0.0, 5.0
gauss_desi_BGS_z0_bsp  = 0.0, 5.0
sample_desi_LRG_z0_b1p = 1.237, 0.0, 3.0, 0.05
sample_desi_LRG_z0_b2p = 0.0, -50.0, 50.0, 1.0
sample_desi_LRG_z0_bsp = 0.0, -50.0, 50.0, 1.0
gauss_desi_LRG_z0_b2p  = 0.0, 5.0
gauss_desi_LRG_z0_bsp  = 0.0, 5.0
sample_desi_LRG_z1_b1p = 1.123, 0.0, 3.0, 0.05
sample_desi_LRG_z1_b2p = 0.0, -50.0, 50.0, 1.0
sample_desi_LRG_z1_bsp = 0.0, -50.0, 50.0, 1.0
gauss_desi_LRG_z1_b2p  = 0.0, 5.0
gauss_desi_LRG_z1_bsp  = 0.0, 5.0
sample_desi_LRG_z2_b1p = 1.017, 0.0, 3.0, 0.05
sample_desi_LRG_z2_b2p = 0.0, -50.0, 50.0, 1.0
sample_desi_LRG_z2_bsp = 0.0, -50.0, 50.0, 1.0
gauss_desi_LRG_z2_b2p  = 0.0, 5.0
gauss_desi_LRG_z2_bsp  = 0.0, 5.0
sample_desi_ELG_z1_b1p = 0.516, 0.0, 3.0, 0.05
sample_desi_ELG_z1_b2p = 0.0, -50.0, 50.0, 1.0
sample_desi_ELG_z1_bsp = 0.0, -50.0, 50.0, 1.0
gauss_desi_ELG_z1_b2p  = 0.0, 5.0
gauss_desi_ELG_z1_bsp  = 0.0, 5.0
sample_desi_QSO_z0_b1p = 0.845, 0.0, 3.0, 0.05
sample_desi_QSO_z0_b2p = 0.0, -50.0, 50.0, 1.0
sample_desi_QSO_z0_bsp = 0.0, -50.0, 50.0, 1.0
gauss_desi_QSO_z0_b2p  = 0.0, 5.0
gauss_desi_QSO_z0_bsp  = 0.0, 5.0

mcmc_chains      = 4
mcmc_burn_in     = 2000
mcmc_min_samples = 6000
mcmc_oversample_fast = 8
mcmc_output      = chains/lcdm_desi_fs_bbn
mcmc_resume      = true
