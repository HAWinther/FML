# Flat LCDM from the Planck 2018 CMB spectra: plik_lite TT, TE, EE (ell >= 30) + the two low-ell TT bins, with a
# Gaussian prior on tau from Planck's low-ell EE (lowE) instead of its likelihood. One massive neutrino with
# m_nu = 0.06 eV, Y_p, N_eff and T_CMB as in Planck 2018 (preset).
#
#   make && ./mcmc params/mcmc_planck_lite_lcdm.ini                        (OpenMP only)
#   make clean && make USE_MPI=true && mpirun -np 4 ./mcmc params/mcmc_planck_lite_lcdm.ini   (one chain per process)
#
# ~15 s per evaluation on 2 cores with precision = fast; a converged run (R-1 < 0.02) needs ~3000-5000 samples
# per chain after the burn-in, i.e. ~1 day with 4 processes of 8 cores each. The proposal starts from
# params/mcmc_planck_lite_lcdm.covmat (made with mcmc_hessian, see apps/mcmc.cpp), so the burn-in is short.
# Expected (Planck 2018 VI, TT,TE,EE+lowE): omega_b = 0.02236 +- 0.00015, omega_cdm = 0.1202 +- 0.0014,
# n_s = 0.9649 +- 0.0044, ln(10^10 A_s) = 3.045 +- 0.016, tau = 0.0544 +- 0.0073, H0 = 67.27 +- 0.60.
preset = planck2018
precision = fast
nonlinear = halofit      # nonlinear lensing (as Planck)
Yp_bbn = true            # helium from BBN for each omega_b (as Planck)
m_nu = 0.06
likelihoods = planck_lite_TTTEEE_lowl

sample_omega_b      = 0.02237, 0.019, 0.026, 0.00015
sample_omega_cdm    = 0.1200, 0.10, 0.14, 0.0013
sample_theta_MC_100 = 1.04090, 1.03, 1.05, 0.0003
sample_tau_reio     = 0.0544, 0.01, 0.12, 0.007
sample_logA         = 3.044, 2.8, 3.3, 0.014
sample_n_s          = 0.9649, 0.90, 1.03, 0.004
sample_A_planck     = 1.0, 0.98, 1.02, 0.0025
gauss_tau_reio      = 0.0506, 0.0086      # Planck 2018 lowE (SimAll) alone
gauss_A_planck      = 1.0, 0.0025         # Planck absolute calibration

mcmc_covmat      = params/mcmc_planck_lite_lcdm.covmat
mcmc_chains      = 4
mcmc_burn_in     = 600
mcmc_adapt_every = 100
mcmc_min_samples = 3000
mcmc_check_every = 200
mcmc_max_steps   = 20000
mcmc_Rminus1     = 0.02
mcmc_output      = chains/planck_lite_lcdm
mcmc_oversample_fast = 4     # fast updates of A_planck per step (reuse the cached theory)
mcmc_resume      = true      # continue from the checkpoints if the run was interrupted
