# w0-wa dark energy (smooth) from DESI DR2 BAO, Planck 2018 distance priors and Pantheon+ supernovae (absolute
# magnitude marginalized; python3 python/fetch_sn_data.py). The distance priors assume standard early-universe
# physics, which holds here. desy5 or union3 instead of pantheonplus give the other DESI DR2 combinations.
#   ./mcmc params/mcmc_w0wa.ini
likelihoods = desi_dr2, planck_dp, pantheonplus
model = w0wa
m_nu = 0.06
sample_H0        = 68.0,  50.0, 90.0, 0.5
sample_omega_b   = 0.0224, 0.018, 0.027, 0.0002
sample_omega_cdm = 0.119, 0.09, 0.15, 0.001
sample_w0        = -0.9, -2.0, 0.0, 0.05
sample_wa        = -0.3, -3.0, 2.0, 0.2
mcmc_chains = 4
mcmc_burn_in = 3000
mcmc_min_samples = 6000
mcmc_output = chains/w0wa_desi_planckdp_pantheonplus
