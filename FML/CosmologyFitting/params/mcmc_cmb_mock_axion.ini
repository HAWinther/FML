# Fit check for the ultralight-axion parameters: mock TT, TE, EE (ell <= 2000, 10 muK arcmin, 3' beam, f_sky = 0.4)
# for the Planck 2018 cosmology with 10% of the dark matter in an axion of mass 1e-26 eV (model = axion); the LCDM
# parameters are fixed to the fiducial. The fit must recover the fiducial. Make the fiducial spectra first (same
# precision as the fit):
#
#   cd ../Cosmology/EinsteinBoltzmannSolver && ./cmb params/planck2018.ini m_nu=0.06 precision=fast model=axion \
#         ax_log10_m=-26 ax_fraction=0.1 lensing=true ell_max=2000 output_dir=../../CosmologyFitting/data/cmb_mock_axion && cd -
#   ./mcmc params/mcmc_cmb_mock_axion.ini sampler=minimize minimize_hessian=true      (best fit + errors)
#   ./mcmc params/mcmc_cmb_mock_axion.ini                                             (MCMC)
#
# ~10 s per point on 2 cores. Any model parameter can be sampled the same way (ax_switch_mH, ax_log10_Hinf for the
# axion isocurvature, or f_axi directly).
preset = planck2018
precision = fast
m_nu = 0.06
model = axion
likelihoods = cmb_mock
cmb_mock_file  = data/cmb_mock_axion/cells_lensed.txt
cmb_mock_lmax  = 2000
cmb_mock_fsky  = 0.4
cmb_mock_noise = 10      # muK arcmin (temperature; polarization x sqrt 2)
cmb_mock_beam  = 3       # arcmin FWHM

sample_ax_fraction = 0.05, 0.001, 0.5, 0.02, f_{\rm ax}
sample_ax_log10_m  = -25.5, -27.5, -24.0, 0.2, \log_{10}(m_{\rm ax}/{\rm eV})

minimize_starts  = 2
mcmc_chains      = 2
mcmc_burn_in     = 300
mcmc_min_samples = 1000
mcmc_output      = chains/cmb_mock_axion
