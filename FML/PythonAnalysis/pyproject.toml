[build-system]
requires = ["setuptools>=64", "wheel", "pybind11>=2.11,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "fml-analysis"
version = "0.1.0"
description = "Owned catalogue and spatial-statistics interface for FML"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]
readme = "README.md"
