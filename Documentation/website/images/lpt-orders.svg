<title id="title">Lagrangian perturbation theory orders and dealiasing</title><desc id="desc">Three panels compare an initial Lagrangian lattice, its first-order displacement, and higher-order deformations including a third-order transverse component. A lower strip illustrates padding the Fourier grid before forming nonlinear sources.</desc>
