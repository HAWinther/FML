<title id="title">Watershed basins and separating ridges</title><desc id="desc">A schematic one-dimensional density landscape shows local minima as basin centers and ridges as watershed boundaries. A matching colored two-dimensional field illustrates catchment basins around minima.</desc><rect width="1080" height="420" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="540" y="42" text-anchor="middle" font-size="22" font-weight="700">Watershed segmentation: basins meet at ridges</text><text x="530" y="82" text-anchor="middle" font-size="15" font-weight="600">Density landscape (schematic)</text>
<path d="M100 240C140 195 170 198 200 260S260 322 300 240S355 185 390 258S455 300 500 210S555 170 590 255S655 330 700 235S765 180 805 260S870 312 920 225S980 190 1010 250" fill="none" stroke="#2563eb" stroke-width="4"/>
<path d="M100 240C140 195 170 198 200 260S260 322 300 240S355 185 390 258S455 300 500 210S555 170 590 255S655 330 700 235S765 180 805 260S870 312 920 225S980 190 1010 250L1010 345H100Z" fill="#dbeafe" opacity=".45"/><path d="M200 260V345M390 258V345M590 255V345M805 260V345" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5"/><g fill="#0f766e"><circle cx="200" cy="260" r="6"/><circle cx="390" cy="258" r="6"/><circle cx="590" cy="255" r="6"/><circle cx="805" cy="260" r="6"/></g><text x="200" y="365" text-anchor="middle" font-size="12">basin minima</text><text x="495" y="195" text-anchor="middle" font-size="12" fill="#c2410c">ridges separate catchments</text>
<rect x="120" y="385" width="840" height="16" rx="8" fill="url(#basins)"/><defs><linearGradient id="basins"><stop stop-color="#2563eb"/><stop offset=".25" stop-color="#0f766e"/><stop offset=".5" stop-color="#7c3aed"/><stop offset=".75" stop-color="#ea580c"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs></g></svg>
