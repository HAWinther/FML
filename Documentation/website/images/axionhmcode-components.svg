<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">AxionHMcode mixed cold and axion matter components</title><desc id="desc">Supplied linear cold and axion spectra feed separate nonlinear component calculations. The model returns cold, cold-axion cross, axion, and weighted total power. A schematic inset marks a soliton inner region transitioning to an NFW-like outer axion profile.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#64748b"/></marker></defs><rect width="1120" height="460" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="560" y="42" text-anchor="middle" font-size="22" font-weight="700">AxionHMcode: mixed cold + ultralight-axion matter</text>
<g text-anchor="middle"><rect x="45" y="105" width="235" height="95" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="162" y="140" font-size="16" font-weight="700">Linear spectra supplied</text><text x="162" y="169" font-size="14">Pcb(k) · Paxion(k)</text><rect x="350" y="105" width="260" height="95" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="480" y="140" font-size="16" font-weight="700">Component halo model</text><text x="480" y="169" font-size="13">Jeans scale · clustered fraction</text><rect x="680" y="85" width="390" height="140" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="875" y="112" font-size="14" font-weight="700">Axion halo profile (schematic)</text><path d="M725 190C750 125 780 140 805 160S855 178 900 187S980 196 1035 201" fill="none" stroke="#7c3aed" stroke-width="4"/><path d="M724 200H1035M724 200V128" fill="none" stroke="#94a3b8" stroke-width="1.5"/><text x="784" y="219" font-size="11">soliton core → NFW-like envelope</text></g>
<path d="M280 153h62M610 153h63" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<rect x="170" y="280" width="780" height="100" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="560" y="313" text-anchor="middle" font-size="16" font-weight="700">Returned nonlinear spectra</text><g text-anchor="middle" font-size="14"><text x="280" y="348">Pcb</text><text x="455" y="348">Pcb,axion</text><text x="650" y="348">Paxion</text><text x="835" y="348" fill="#0f766e" font-weight="700">Ptotal</text></g><path d="M480 200v48q0 16 16 16h64" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
<text x="560" y="425" text-anchor="middle" font-size="14" fill="#475569">Total matter: (1 − f)²Pcb + 2f(1 − f)Pcb,axion + f²Paxion</text><text x="560" y="447" text-anchor="middle" font-size="11" fill="#64748b">Conceptual flow; the module needs external linear spectra and is standalone.</text></g></svg>
