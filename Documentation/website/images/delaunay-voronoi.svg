<title id="title">Delaunay triangulation and dual Voronoi cells</title><desc id="desc">The left panel shows a set of points connected into Delaunay triangles. The right panel shows the dual Voronoi regions, each containing the points closer to one site than to any other.</desc><rect width="1080" height="430" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="540" y="42" text-anchor="middle" font-size="22" font-weight="700">Delaunay triangulation and its Voronoi dual</text><text x="285" y="82" text-anchor="middle" font-size="16" font-weight="600">Delaunay triangles</text><text x="795" y="82" text-anchor="middle" font-size="16" font-weight="600">Voronoi cells</text>
