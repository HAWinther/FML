<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
<title id="title">Halo-model power spectrum components</title><desc id="desc">Schematic log-scale curves show the large-scale two-halo contribution, small-scale one-halo contribution, and their smooth total. The illustration is conceptual and not numerical model output.</desc>
<rect width="1080" height="500" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="540" y="42" text-anchor="middle" font-size="22" font-weight="700">Halo model: large-scale clustering meets halo structure</text>
<path d="M130 390V100M130 390H970" fill="none" stroke="#334155" stroke-width="2.5"/><text x="550" y="450" text-anchor="middle" font-size="16">wavenumber k (increasing →)</text><text x="45" y="245" text-anchor="middle" font-size="15" transform="rotate(-90 45 245)">power (schematic)</text>
<path d="M145 170C300 180 410 220 510 275S760 365 940 370" fill="none" stroke="#2563eb" stroke-width="5"/><path d="M145 370C330 365 440 335 530 280S760 180 940 160" fill="none" stroke="#ea580c" stroke-width="5"/><path d="M145 175C330 185 430 225 510 260S620 278 700 255S830 205 940 185" fill="none" stroke="#0f766e" stroke-width="6"/>
<g font-size="15" font-weight="600"><rect x="760" y="90" width="230" height="78" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M778 112h35" stroke="#2563eb" stroke-width="4"/><text x="824" y="117">two-halo</text><path d="M778 135h35" stroke="#ea580c" stroke-width="4"/><text x="824" y="140">one-halo</text><path d="M778 157h35" stroke="#0f766e" stroke-width="4"/><text x="824" y="162">total (schematic)</text></g>
<g font-size="13" fill="#475569"><text x="190" y="220">halo clustering</text><text x="790" y="348">internal halo profiles</text><text x="533" y="302">transition</text></g>
<text x="540" y="480" text-anchor="middle" font-size="12" fill="#64748b">Conceptual decomposition only; no calibrated or measured values shown.</text></g></svg>
