<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc">
<title id="title">FFTWGrid slab storage and in-place transform</title><desc id="desc">An MPI rank stores a local x slab, optional extra left and right slices, and a Fourier-padded final dimension. The same aligned allocation holds real values before and complex values after the transform.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#64748b"/></marker></defs><rect width="1080" height="390" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="540" y="42" text-anchor="middle" font-size="22" font-weight="700">FFTWGrid: local slab, padding, and one shared buffer</text>
<g text-anchor="middle"><rect x="100" y="105" width="150" height="90" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="250" y="105" width="95" height="90" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><rect x="345" y="105" width="390" height="90" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="735" y="105" width="95" height="90" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><rect x="830" y="105" width="150" height="90" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="175" y="143" font-size="14">other rank</text><text x="297" y="143" font-size="13">extra</text><text x="540" y="143" font-size="17" font-weight="700">this rank's local x slab</text><text x="782" y="143" font-size="13">extra</text><text x="905" y="143" font-size="14">other rank</text><text x="297" y="168" font-size="11">left</text><text x="782" y="168" font-size="11">right</text></g>
<path d="M345 216H735" stroke="#334155" stroke-width="2"/><path d="M345 210v12M735 210v12" stroke="#334155" stroke-width="2"/><text x="540" y="243" text-anchor="middle" font-size="13">rank-local storage; extra slices are optional</text>
<rect x="145" y="278" width="300" height="58" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="295" y="314" text-anchor="middle" font-size="15" font-weight="700">real values + FFT padding</text><path d="M465 307h145" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><rect x="635" y="278" width="300" height="58" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="785" y="314" text-anchor="middle" font-size="15" font-weight="700">complex Fourier values</text>
<text x="540" y="367" text-anchor="middle" font-size="12" fill="#64748b">The transform is in-place: storage is reused; the logical layout and grid status change.</text></g></svg>
