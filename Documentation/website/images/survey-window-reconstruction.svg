<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Survey multipoles, window mixing, and BAO reconstruction</title><desc id="desc">A masked survey with a local line of sight produces weighted Fourier multipoles. The survey window mixes input theory bandpowers into measured bandpowers. Reconstruction estimates large-scale displacements and shifts data and random catalogues before remeasuring.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#64748b"/></marker></defs><rect width="1120" height="470" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="560" y="42" text-anchor="middle" font-size="22" font-weight="700">Survey clustering: geometry, window, reconstruction</text>
<g text-anchor="middle"><rect x="38" y="105" width="210" height="120" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><path d="M75 205L118 125L210 205" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="118" cy="125" r="6" fill="#ea580c"/><circle cx="142" cy="164" r="5" fill="#2563eb"/><circle cx="175" cy="187" r="5" fill="#2563eb"/><text x="143" y="247" font-size="13" font-weight="600">masked catalogue + local LOS</text>
<rect x="300" y="105" width="210" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="405" y="148" font-size="16" font-weight="700">FKP / Yamamoto</text><text x="405" y="177" font-size="13">P₀(k) · P₂(k) · P₄(k)</text><text x="405" y="201" font-size="12">randoms set normalization</text>
<rect x="562" y="105" width="230" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="677" y="146" font-size="16" font-weight="700">Survey window</text><text x="677" y="174" font-size="13">Qℓ(s) → window matrix</text><text x="677" y="199" font-size="12">theory → convolved bands</text>
<rect x="842" y="105" width="240" height="120" rx="12" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text x="962" y="146" font-size="16" font-weight="700">BAO reconstruction</text><text x="962" y="174" font-size="13">solve displacement field Ψ</text><text x="962" y="199" font-size="12">shift data + randoms; remeasure</text></g>
<g stroke="#64748b" stroke-width="3" marker-end="url(#a)"><path d="M248 165h45"/><path d="M510 165h45"/><path d="M792 165h45"/></g>
<rect x="70" y="310" width="980" height="95" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><g font-size="13" text-anchor="middle"><text x="190" y="348" font-weight="700">Input theory</text><text x="190" y="373">Pℓ(k) bands</text><text x="420" y="348" font-weight="700">Window convolution</text><text x="420" y="373">mixes scales and multipoles</text><text x="675" y="348" font-weight="700">Measured prediction</text><text x="675" y="373">compare in observed geometry</text><text x="915" y="348" font-weight="700">Reconstructed signal</text><text x="915" y="373">reduced bulk-flow smearing</text></g><path d="M270 357h105M535 357h105M790 357h95" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><text x="560" y="442" text-anchor="middle" font-size="12" fill="#64748b">Workflow schematic; not a particular survey mask or measured spectrum.</text></g></svg>
