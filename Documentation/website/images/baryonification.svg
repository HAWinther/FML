<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
<title id="title">Baryonification radial profile remapping</title><desc id="desc">A halo's dark-matter-only radial mass profile is compared with a baryon-corrected profile containing a central galaxy, retained gas, ejected gas, and collisionless matter. Particle radii are remapped by matching enclosed mass.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#ea580c"/></marker></defs><rect width="1080" height="430" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="540" y="42" text-anchor="middle" font-size="22" font-weight="700">Baryonification: conserve enclosed mass, move particles</text>
<text x="255" y="88" text-anchor="middle" font-size="16" font-weight="600">Reference halo</text><text x="810" y="88" text-anchor="middle" font-size="16" font-weight="600">Baryon-corrected components</text>
<circle cx="255" cy="235" r="122" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="255" cy="235" r="78" fill="#bfdbfe" stroke="#60a5fa" stroke-width="2"/><circle cx="255" cy="235" r="36" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/><circle cx="255" cy="235" r="8" fill="#0f172a"/>
<g fill="#1d4ed8"><circle cx="165" cy="190" r="5"/><circle cx="220" cy="150" r="5"/><circle cx="320" cy="170" r="5"/><circle cx="355" cy="250" r="5"/><circle cx="300" cy="330" r="5"/><circle cx="175" cy="290" r="5"/></g>
<circle cx="810" cy="235" r="122" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><circle cx="810" cy="235" r="86" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><circle cx="810" cy="235" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="810" cy="235" r="12" fill="#7c3aed"/>
<g fill="#ea580c"><circle cx="715" cy="177" r="5"/><circle cx="695" cy="260" r="5"/><circle cx="755" cy="334" r="5"/><circle cx="900" cy="145" r="5"/><circle cx="932" cy="220" r="5"/><circle cx="890" cy="327" r="5"/></g>
<path d="M386 190C520 120 575 120 690 176M390 280C525 350 590 344 698 282" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/>
<g font-size="13"><text x="810" y="231" text-anchor="middle" fill="#fff" font-weight="700">central galaxy</text><text x="810" y="155" text-anchor="middle" fill="#0f766e">collisionless matter</text><text x="810" y="365" text-anchor="middle" fill="#c2410c">gas / ejected material</text><text x="540" y="210" text-anchor="middle" fill="#475569">rᵢ → r_f</text><text x="540" y="236" text-anchor="middle" fill="#475569">Msource(<tspan font-style="italic">rᵢ</tspan>) = Mtarget(<tspan font-style="italic">r_f</tspan>)</text></g>
<text x="540" y="405" text-anchor="middle" font-size="13" fill="#64748b">Conceptual profile map; radial proportions are illustrative, not fitted data.</text></g></svg>
