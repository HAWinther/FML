<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
<title id="title">MPI pencil decomposition, transpose, and ghost exchange</title><desc id="desc">A 2 by 2 process grid owns real-space x-y pencils, then all-to-all transposes redistribute Fourier ky-kz pencils. A neighboring-rank diagram shows periodic ghost cells copied at boundaries.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#64748b"/></marker></defs><rect width="1120" height="520" rx="18" fill="#f8fafc"/><g font-family="Inter,Arial,sans-serif" fill="#0f172a"><text x="560" y="40" text-anchor="middle" font-size="22" font-weight="700">Pencil layout: local transforms + MPI transposes</text>
<text x="255" y="82" text-anchor="middle" font-size="16" font-weight="600">Real-space ownership (x,y)</text><text x="840" y="82" text-anchor="middle" font-size="16" font-weight="600">Fourier ownership (kᵧ,k_z)</text>
<g stroke="#fff" stroke-width="4" font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="700" font-size="15"><rect x="100" y="110" width="150" height="105" fill="#2563eb"/><rect x="250" y="110" width="150" height="105" fill="#0f766e"/><rect x="100" y="215" width="150" height="105" fill="#7c3aed"/><rect x="250" y="215" width="150" height="105" fill="#ea580c"/><text x="175" y="168" fill="#fff">rank 0</text><text x="325" y="168" fill="#fff">rank 1</text><text x="175" y="273" fill="#fff">rank 2</text><text x="325" y="273" fill="#fff">rank 3</text></g>
<g stroke="#fff" stroke-width="4" font-family="Inter,Arial,sans-serif" text-anchor="middle" font-weight="700" font-size="15"><rect x="685" y="110" width="150" height="105" fill="#2563eb"/><rect x="835" y="110" width="150" height="105" fill="#0f766e"/><rect x="685" y="215" width="150" height="105" fill="#7c3aed"/><rect x="835" y="215" width="150" height="105" fill="#ea580c"/><text x="760" y="168" fill="#fff">rank 0</text><text x="910" y="168" fill="#fff">rank 1</text><text x="760" y="273" fill="#fff">rank 2</text><text x="910" y="273" fill="#fff">rank 3</text></g>
<path d="M430 210h220" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><text x="540" y="185" text-anchor="middle" font-size="14">all-to-all transpose</text><text x="540" y="240" text-anchor="middle" font-size="13" fill="#475569">local FFTs between exchanges</text>
<text x="255" y="350" text-anchor="middle" font-size="12" fill="#475569">each rank owns one real-space pencil</text><text x="840" y="350" text-anchor="middle" font-size="12" fill="#475569">data redistributed for k-space transforms</text>
<rect x="75" y="385" width="970" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><rect x="95" y="405" width="180" height="50" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="275" y="405" width="45" height="50" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><rect x="320" y="405" width="360" height="50" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><rect x="680" y="405" width="45" height="50" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><rect x="725" y="405" width="180" height="50" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><text x="185" y="436" text-anchor="middle" font-size="13">neighbor rank</text><text x="297" y="436" text-anchor="middle" font-size="12">ghost</text><text x="500" y="436" text-anchor="middle" font-size="14" font-weight="700">local interior cells</text><text x="702" y="436" text-anchor="middle" font-size="12">ghost</text><text x="815" y="436" text-anchor="middle" font-size="13">neighbor rank</text>
<text x="560" y="500" text-anchor="middle" font-size="13" fill="#475569">Periodic halo exchange fills ghosts; reverse exchange can accumulate contributions onto owners.</text></g></svg>
