# Build the library examples, run the library and module tests and build SimulationCode on every push and pull
# request. Four jobs run in parallel (each with its own compiler cache); the tests run on 1 and 4 MPI tasks. The
# nightly workflow (nightly.yml) adds 2 tasks, the Einstein-Boltzmann solver's tests and the long SimulationCode checks
name: CI

# Not for changes to documentation only (markdown files, the book and the website); PARAMETERS.md is checked against
# the parameter schema, so it starts CI. Run CI by hand from the Actions tab, or skip it with [skip ci] in the message
on:
  push:
    paths:
      - '**'
      - '!**.md'
      - '!Documentation/**'
      - 'FML/SimulationCode/PARAMETERS.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!Documentation/**'
      - 'FML/SimulationCode/PARAMETERS.md'
  workflow_dispatch:

# A new push to a branch cancels the CI still running for an older commit of it, except on master: there every commit
# gets a full result (a cancelled run shows as failing in the README badge)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Idle OpenMP threads sleep: the tests run more tasks x threads than the runner has cores (also set by the Makefiles)
  OMP_WAIT_POLICY: passive
  MPIRUN: mpirun --oversubscribe

jobs:
  # No big files in the repository (they stay in the history for good): seconds, no dependencies
  large-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: No tracked file over 1 MB outside the allow-list
        run: .github/ci/check_large_files.sh

  examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: examples
      - name: Build the examples
        run: make -C FML examples -j4

  library-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: library-tests
      - name: Library tests (1 and 4 MPI tasks)
        run: make -C FML test -j4 MPIRUN="$MPIRUN" NP_LIST="1 4"

  module-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: module-tests
      # Every FML/*/tests directory except the Einstein-Boltzmann solver's (~15 min: nightly) and Analysis and
      # SnapshotAnalyzer (run with CGAL and HDF5 in the analysis-and-simulation job)
      - name: Module tests (1 and 4 MPI tasks)
        run: |
          NP_LIST="1 4" .github/ci/run_module_tests.sh Cosmology/EinsteinBoltzmannSolver/tests Analysis/tests \
            SnapshotAnalyzer/tests

      - name: Single-precision arbitrary-order LPT references
        run: |
          make -C FML/LPT/tests clean
          make -C FML/LPT/tests -j4 run USE_MPI=false USE_OMP=true LPT_PRECISION=float FFTW_LINK=-lfftw3f

  analysis-and-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          cache-key: analysis-and-simulation
          extra-packages: libcgal-dev python3-h5py

      # The shared analysis code and the snapshot analyzer with ZOBOV and DTFE (CGAL) and Gadget HDF5 input
      - name: Analysis and SnapshotAnalyzer with CGAL and HDF5 (1 and 4 MPI tasks)
        run: |
          CGAL="USE_CGAL=true CGAL_INCLUDE=/usr/include CGAL_LIB=/usr/lib/x86_64-linux-gnu"
          make -C FML/Analysis/tests -B -j4 run $CGAL MPIRUN="$MPIRUN" NP_LIST="1 4"
          make -C FML/SnapshotAnalyzer/tests run $CGAL USE_HDF5=true MPIRUN="$MPIRUN" NP_LIST="1 4"

      - name: Build SimulationCode (with HDF5)
        run: make -C FML/SimulationCode -B -j4 USE_HDF5=true && ldd FML/SimulationCode/nbody | grep -q hdf5

      - name: SimulationCode baryonification parameter and snapshot-copy tests
        run: make -C FML/SimulationCode/tests run -j4 USE_MPI=false USE_OMP=false
      - name: Every parameter read by SimulationCode is in the parameter schema
        run: python3 FML/SimulationCode/tests/check_parameter_names.py

      - name: PARAMETERS.md is up to date with the parameter schema
        run: |
          cd FML/SimulationCode
          $MPIRUN -np 1 ./nbody --parameters /tmp/PARAMETERS.md
          diff -u PARAMETERS.md /tmp/PARAMETERS.md

      - name: internal_solver_default.ini is up to date with the solver's parameters
        run: |
          cd FML/SimulationCode
          $MPIRUN -np 1 ./nbody --write-solver-defaults /tmp/internal_solver_default.ini
          diff -u internal_solver_default.ini /tmp/internal_solver_default.ini

      - name: SimulationCode stops with a clear message on invalid parameters
        run: |
          MPIRUN="$MPIRUN -np 2" python3 FML/SimulationCode/tests/check_validation.py \
            FML/SimulationCode/nbody "$RUNNER_TEMP/validation"

      - name: Python analysis installed-wheel regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/fml-analysis-env"
          "$RUNNER_TEMP/fml-analysis-env/bin/python" -m pip install ./FML/PythonAnalysis
          "$RUNNER_TEMP/fml-analysis-env/bin/python" -m unittest discover -s FML/PythonAnalysis/tests -v
          "$RUNNER_TEMP/fml-analysis-env/bin/python" FML/PythonAnalysis/examples/catalogue_statistics.py

      - name: Performance counter and report checks (no timing thresholds)
        run: |
          make -C FML/Performance -j4 USE_GSL=false USE_LUA=false
          OMP_NUM_THREADS=2 $MPIRUN -np 2 FML/Performance/test_counters
          OMP_NUM_THREADS=2 $MPIRUN -np 2 FML/Performance/test_counters_disabled
          python3 FML/Performance/test_reports.py --exe FML/Performance/fml_benchmark -v
