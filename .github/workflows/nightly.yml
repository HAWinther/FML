# Longer accuracy checks of SimulationCode, every night and on demand. Also what CI (ci.yml) leaves out to stay fast:
# the library and module tests on 2 MPI tasks too and the Einstein-Boltzmann solver's tests
name: Nightly accuracy checks

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      MPIRUN: mpirun --oversubscribe -np 2
      OUT: ${{ github.workspace }}/nightly
      # Idle OpenMP threads sleep (more tasks x threads than cores)
      OMP_WAIT_POLICY: passive
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup
        with:
          cache-key: nightly
          extra-packages: python3-scipy python3-pip cython3

      # CLASS (python wrapper) for the N-body gauge check
      - name: Install CLASS
        run: pip3 install --break-system-packages classy

      - name: Build SimulationCode
        run: make -C FML/SimulationCode -j4 USE_HDF5=true

      - name: Library tests
        if: always()
        run: make -C FML test -j4 MPIRUN="mpirun --oversubscribe" NP_LIST="1 2 4"

      - name: Module tests, including the Einstein-Boltzmann solver (1, 2 and 4 MPI tasks)
        if: always()
        # (MPIRUN without the -np 2 of the job: the Makefiles add -np)
        run: MPIRUN="mpirun --oversubscribe" .github/ci/run_module_tests.sh

      - name: AMRCode Zel'dovich test (4 MPI tasks)
        if: always()
        run: make -C FML/AMRCode/tests run-zeldovich MPIRUN="mpirun --oversubscribe"

      - name: Regression cases run and are reproducible (two identical runs)
        if: always()
        run: |
          cd FML/SimulationCode/tests/regression
          ./run.sh ../../nbody "$OUT/regression1"
          ./run.sh ../../nbody "$OUT/regression2"
          python3 compare.py "$OUT/regression1" "$OUT/regression2"

      - name: Accuracy vs MG-PICOLA
        if: always()
        run: FML/SimulationCode/tests/run_accuracy_tests.sh FML/SimulationCode/nbody "$OUT/accuracy"

      - name: Non-gaussian initial conditions
        if: always()
        run: python3 FML/SimulationCode/tests/check_nongaussian.py FML/SimulationCode/nbody "$OUT/nongaussian"

      - name: Force grid 2x and 3x the particle grid
        if: always()
        run: |
          GRID_FACTOR=2 python3 FML/SimulationCode/tests/check_force_grid.py FML/SimulationCode/nbody "$OUT/forcegrid2"
          GRID_FACTOR=3 python3 FML/SimulationCode/tests/check_force_grid.py FML/SimulationCode/nbody "$OUT/forcegrid3"

      - name: Time-stepping
        if: always()
        run: python3 FML/SimulationCode/tests/check_timestepping.py FML/SimulationCode/nbody "$OUT/timestepping"

      - name: N-body gauge
        if: always()
        run: python3 FML/SimulationCode/tests/check_nbody_gauge.py FML/SimulationCode/nbody "$OUT/nbgauge"

      - name: Snapshot baryonification and unchanged subsequent evolution
        if: always()
        run: python3 FML/SimulationCode/tests/check_baryonification.py FML/SimulationCode/nbody "$OUT/baryonification"

      - name: Images of fields at the outputs
        if: always()
        run: python3 FML/SimulationCode/tests/check_images.py FML/SimulationCode/nbody "$OUT/images"

      # The default build has one particle type with all the fields; USE_MINIMAL_PARTICLES compiles the 7 smaller types
      # and picks the one a run needs: the results must be identical
      - name: USE_MINIMAL_PARTICLES gives the same regression results as the fiducial particle
        if: always()
        run: |
          make -C FML/SimulationCode clean
          make -C FML/SimulationCode -j4 USE_HDF5=true USE_MINIMAL_PARTICLES=true
          cd FML/SimulationCode/tests/regression
          ./run.sh ../../nbody "$OUT/regression_minimal"
          python3 compare.py "$OUT/regression1" "$OUT/regression_minimal" --rtol 0 --atol 0

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: nightly-logs
          path: nightly/**/log.txt
          retention-days: 14
